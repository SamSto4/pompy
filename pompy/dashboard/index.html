<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f8fa">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0d12">
<title>Pompy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<script>
  // Theme before first paint: saved choice, else the system's.
  (function () {
    try { var t = localStorage.getItem("pompy-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
    document.documentElement.classList.add("js");
  })();
</script>
<style>
/* Pompy on Volt. Quiet ground, bold signal: cobalt for the one action, lime fills for highlights,
   Space Grotesk headings, Inter text. Exact Volt v2 tokens; light and dark share every name.
   New here (not in Volt yet): score ring, factor bars, sliding nav, sparkline, heat grid, theme switch. */
:root {
  --surface: #f7f8fa; --surface-raised: #ffffff; --line: #e3e6ec;
  --ink: #0e1116; --ink-muted: #5a6372;
  --primary: #2b5cff; --on-primary: #ffffff;
  --accent: #c6f432; --on-accent: #0e1116;
  --success: #0b7f57; --danger: #d13438;
  --shadow-lift: 0 8px 24px -12px rgba(14, 17, 22, 0.18);
  --shadow-glow: 0 6px 20px -6px rgba(43, 92, 255, 0.45);
  --shadow-focus: 0 0 0 4px rgba(43, 92, 255, 0.18);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --surface: #0b0d12; --surface-raised: #151922; --line: #252b36;
  --ink: #f2f4f8; --ink-muted: #9aa3b2;
  --primary: #5b82ff; --on-primary: #0b0d12;
  --success: #3dd68c; --danger: #ff6369;
  --shadow-lift: 0 8px 24px -12px rgba(0, 0, 0, 0.6);
  --shadow-glow: 0 6px 24px -6px rgba(91, 130, 255, 0.55);
  --shadow-focus: 0 0 0 4px rgba(91, 130, 255, 0.28);
  color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --surface: #0b0d12; --surface-raised: #151922; --line: #252b36;
    --ink: #f2f4f8; --ink-muted: #9aa3b2;
    --primary: #5b82ff; --on-primary: #0b0d12;
    --success: #3dd68c; --danger: #ff6369;
    --shadow-lift: 0 8px 24px -12px rgba(0, 0, 0, 0.6);
    --shadow-glow: 0 6px 24px -6px rgba(91, 130, 255, 0.55);
    --shadow-focus: 0 0 0 4px rgba(91, 130, 255, 0.28);
    color-scheme: dark;
  }
}
:root {
  --space-2: 8px; --space-4: 16px; --space-6: 24px; --space-10: 40px;
  --radius-sm: 6px; --radius-md: 12px; --radius-full: 9999px;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: Inter, system-ui, -apple-system, sans-serif;
  /* Motion tokens (design-engineer C2) */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --dur-press: 140ms; --dur-hover: 200ms; --dur-enter: 420ms;
  /* Older names the views use, mapped onto Volt roles */
  --paper: var(--surface); --panel: var(--surface-raised); --muted: var(--ink-muted);
  --soft: color-mix(in srgb, var(--primary) 10%, var(--surface-raised));
  --accent-soft: var(--soft);
  --purple: var(--primary); --note: var(--danger);
  --note-soft: color-mix(in srgb, var(--danger) 10%, var(--surface-raised));
  --good: var(--success); --warn: var(--ink-muted); --bad: var(--danger);
  --radius: var(--radius-md);
  --lime-soft: color-mix(in srgb, var(--accent) 22%, var(--surface-raised));
}
* { box-sizing: border-box; min-width: 0; }
html { -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
html, body { margin: 0; }
body { background: var(--surface); color: var(--ink); font: 16px/24px var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: clamp(36px, 5vw, 56px); line-height: 1.07; font-weight: 700; letter-spacing: -0.02em; }
h2 { font-size: 24px; line-height: 30px; font-weight: 600; }
h3 { font-size: 16px; line-height: 22px; font-weight: 600; }
p { margin: 0; }
a { color: var(--primary); }
.mono, .num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 14px; line-height: 20px; }
.eyebrow, .label-caps { font: 600 12px/16px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
button, select, input, textarea { font: inherit; color: inherit; }
button, a, summary, [role="button"] { touch-action: manipulation; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { box-shadow: var(--shadow-focus); }
.hidden { display: none !important; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 20; background: var(--primary); color: var(--on-primary); padding: 8px 16px; border-radius: var(--radius-full); text-decoration: none; }
.skip:focus { top: 12px; }

/* ── Top bar and navigation ─────────────────────────────────────────── */
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 24px; }
header.top { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--surface) 86%, transparent);
  -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); border-bottom: 1px solid var(--line); }
@media (prefers-reduced-transparency: reduce) { header.top { background: var(--surface); backdrop-filter: none; -webkit-backdrop-filter: none; } }
.top-row { display: flex; align-items: center; gap: 12px 20px; padding: 14px 0 6px; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 22px/1 var(--font-display); letter-spacing: -0.02em; margin: 0; }
.brand i { width: 14px; height: 14px; border-radius: 4px; background: var(--primary); display: inline-block; }
.brand i + i { background: var(--accent); margin-left: -6px; }
.readouts { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); margin-right: auto; }
.readouts b { color: var(--ink); font-weight: 500; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--radius-full); border: 1px solid var(--line);
  background: var(--surface-raised); cursor: pointer; transition: border-color var(--dur-hover) ease, transform var(--dur-press) var(--ease-out); }
.icon-btn:active { transform: scale(0.94); }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }
nav.tabs { position: relative; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 6px 0 10px; }
nav.tabs::-webkit-scrollbar { display: none; }
nav.tabs a { flex: none; position: relative; z-index: 1; padding: 8px 14px; border-radius: var(--radius-full); color: var(--muted); text-decoration: none;
  white-space: nowrap; font-weight: 500; font-size: 15px; transition: color var(--dur-hover) ease; }
nav.tabs a[aria-current="page"] { color: var(--on-primary); }
nav.tabs .ind { position: absolute; z-index: 0; left: 0; top: 6px; height: 40px; border-radius: var(--radius-full); background: var(--primary);
  width: 0; transform: translateX(0); }
nav.tabs.ready .ind { transition: transform 320ms var(--ease-out), width 320ms var(--ease-out); }
nav.tabs .new { display: inline-block; margin-left: 6px; padding: 1px 6px; border-radius: var(--radius-full); background: var(--accent); color: var(--on-accent);
  font: 600 10px/14px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; vertical-align: 2px; }

/* ── Layout ─────────────────────────────────────────────────────────── */
main.wrap { padding-top: var(--space-10); padding-bottom: 96px; }
section.view { display: none; flex-direction: column; gap: var(--space-6); }
section.view.on { display: flex; }
.page-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; }
.page-head h1 { font-size: clamp(30px, 3.6vw, 40px); line-height: 1.1; }
.lede { max-width: 68ch; color: var(--muted); font-size: 17px; line-height: 26px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: var(--space-6); }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: var(--space-6); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-6);
  display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px 12px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 180px), 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4) var(--space-6); display: flex; flex-direction: column; gap: 4px; }
.tile .label { font: 600 12px/16px var(--font-body); color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.tile .value { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: 34px; font-weight: 600; line-height: 1.1; letter-spacing: -0.02em; }
.tile .sub { font-size: 13px; line-height: 18px; color: var(--muted); }
.tile.hl { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tile.hl .label, .tile.hl .sub { color: color-mix(in srgb, var(--on-accent) 72%, transparent); }

/* ── Controls ───────────────────────────────────────────────────────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 40px; border: 1px solid var(--line);
  background: var(--panel); padding: 0 18px; border-radius: var(--radius-full); cursor: pointer; font-weight: 500; color: var(--ink); text-decoration: none;
  transition: border-color var(--dur-hover) ease, box-shadow var(--dur-hover) var(--ease-out), transform var(--dur-press) var(--ease-out); user-select: none; -webkit-user-select: none; }
.btn:active { transform: scale(0.97); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:active { box-shadow: none; transform: translateY(1px) scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: default; transform: none; }
a.btn { text-decoration: none; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls.spread { justify-content: space-between; }
.controls select, .controls input, input.text, textarea, select.sel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 12px; min-width: 0; min-height: 40px;
  transition: border-color var(--dur-hover) ease, box-shadow var(--dur-hover) ease; }
.controls input[type="search"] { flex: 1 1 220px; }
input[type="range"] { accent-color: var(--primary); }
textarea { width: 100%; resize: vertical; min-height: 110px; line-height: 1.5; }
.seg-tabs { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: var(--radius-full); background: var(--surface); }
.seg-tab { border: 0; background: transparent; min-height: 32px; padding: 0 14px; border-radius: var(--radius-full); color: var(--muted); cursor: pointer; font-weight: 500;
  transition: background-color var(--dur-hover) var(--ease-out), color var(--dur-hover) ease, transform var(--dur-press) var(--ease-out); }
.seg-tab:active { transform: scale(0.97); }
.seg-tab[aria-selected="true"] { background: var(--primary); color: var(--on-primary); }
.linkish { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 14px; }

/* ── Data pieces ────────────────────────────────────────────────────── */
.bars { display: flex; flex-direction: column; gap: 8px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr 64px; gap: 12px; align-items: center; font-size: 14px; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 10px; background: var(--soft); border-radius: var(--radius-full); overflow: hidden; }
.bar-fill { height: 100%; background: var(--primary); border-radius: var(--radius-full); transform-origin: left; }
.bar-fill.lime { background: var(--accent); }
.bar-row .num { text-align: right; font-size: 13px; color: var(--muted); }
.readout { min-height: 1.4em; font-size: 13px; color: var(--muted); }
.chart { width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-body); font-size: 10px; }
.chart text.faint { opacity: 0.45; }
.chart text.strong { fill: var(--ink); font-weight: 500; }
.chart circle { transition: r var(--dur-hover) var(--ease-out); }
.chart circle:focus { fill-opacity: 1; stroke: var(--ink); stroke-width: 1.5; outline: none; }
.chart-scroll { overflow-x: auto; }
.legend { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend .dot.sq { border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: var(--radius-full); border: 1px solid var(--line); font-size: 13px; line-height: 20px; white-space: nowrap; }
.chip.fr { background: var(--note-soft); border-color: transparent; color: var(--danger); }
.chip.ok { color: var(--success); border-color: color-mix(in srgb, var(--success) 50%, transparent); }
.chip.lime { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.pill { font: 600 12px/16px var(--font-body); padding: 3px 10px; border-radius: var(--radius-full); background: var(--accent); color: var(--on-accent);
  min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.mid { background: var(--soft); color: var(--primary); }
.pill.low { background: var(--note-soft); color: var(--danger); }
.pill.none { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.note { background: var(--lime-soft); border-left: 3px solid var(--accent); padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm); font-size: 14px; line-height: 20px; }
.thin { color: var(--warn); font-size: 13px; }
.stack { display: flex; height: 18px; border-radius: var(--radius-full); overflow: hidden; gap: 2px; margin: 10px 0 8px; }
.big-line { font-size: 18px; line-height: 28px; }
.big-line b { font-family: var(--font-display); font-size: 32px; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 42px; line-height: 1; }
.meter { height: 8px; background: var(--soft); border-radius: var(--radius-full); overflow: hidden; }
.meter > div { height: 100%; background: var(--primary); border-radius: var(--radius-full); transform-origin: left; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.cmp th { font: 600 12px/16px var(--font-body); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
table.cmp th, table.cmp td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: right; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
table.cmp td.indent { padding-left: 22px; color: var(--muted); }
.better { color: var(--success); } .worse { color: var(--danger); }
.scroll-x { overflow-x: auto; }

/* Prompt lists */
.plist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 12px 8px; border-bottom: 1px solid var(--line); cursor: pointer;
  border-radius: var(--radius-sm); transition: background-color var(--dur-hover) ease; }
.prow:active { background: var(--soft); }
.prow:focus-visible { outline-offset: -2px; }
.prow.static { cursor: default; }
.prow .meta { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prow .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.prow .right { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; align-content: start; max-width: 260px; }
.detail { grid-column: 1 / -1; cursor: default; display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--radius-sm); padding: var(--space-4); margin-top: 6px; }
.detail .full { white-space: pre-wrap; overflow-wrap: anywhere; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 12px; font-size: 14px; }
.checks .yes::before { content: "✓ "; color: var(--success); font-weight: 700; }
.checks .no { color: var(--muted); }
.checks .no::before { content: "· "; }
.quote { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.quote.after { border-left-color: var(--accent); }
ol.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 4px; }
ul.like-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }

/* Habits and coaching */
.habit-rank { font: 600 12px/16px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--on-accent); background: var(--accent); padding: 2px 8px; border-radius: var(--radius-full); }
.habit-body { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: var(--space-4); }
ul.analysis { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
ul.analysis li { padding-left: 1.4em; position: relative; }
ul.analysis li::before { content: "+"; position: absolute; left: 0; color: var(--primary); font-weight: 700; }
ul.analysis li.focus { background: var(--lime-soft); border-radius: var(--radius-sm); padding: 4px 8px 4px 1.8em; }
ul.analysis li.focus::before { left: 8px; top: 4px; }
.better-block { display: flex; flex-direction: column; gap: 10px; }
.coach { max-width: 820px; }
.coach textarea { min-height: 150px; font-size: 17px; }
.coach-read { display: flex; flex-direction: column; gap: 10px; min-height: 3em; }
.coach-score { font-family: var(--font-display); font-size: 20px; }
.coach-score.good { color: var(--success); } .coach-score.ok, .coach-score.low { color: var(--primary); }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); transition: background-color var(--dur-hover) ease, transform var(--dur-hover) var(--ease-out); }
.dots i.on { background: var(--primary); transform: scale(1.08); }
.dots.good i.on { background: var(--accent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--on-accent) 20%, transparent); }
ul.next-list { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
ul.knows { margin: 8px 0 0; padding-left: 1.2em; }

/* Memory and beliefs */
.layers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.layer, .belief { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); background: var(--panel); display: flex; flex-direction: column; gap: 8px; }
.layer .tag, .belief .tag { font: 600 12px/16px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--primary); }
.layer-fact { font-family: var(--font-display); font-size: 28px; font-weight: 600; letter-spacing: -0.01em; }
.beliefs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 12px; }
.belief ul { margin: 0; padding-left: 18px; }
.belief-s { font-weight: 500; }
.belief-meter { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.belief-ev summary, details.testing summary { cursor: pointer; color: var(--muted); }
details.testing summary { font-weight: 600; color: var(--ink); margin: 6px 0; }
.belief-ev[open] { display: flex; flex-direction: column; gap: 8px; }
.ev { display: flex; flex-direction: column; gap: 8px; }
.ev-row { display: flex; flex-direction: column; gap: 2px; }
.ev.for .quote { border-left-color: var(--success); }
.ev.against .quote { border-left-color: var(--danger); }

/* Folded panels */
details.fold { gap: 0; padding: 0; }
details.fold > summary { list-style: none; cursor: pointer; padding: var(--space-4) var(--space-6); border-radius: var(--radius); align-items: center; flex-wrap: nowrap; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { font-size: 18px; line-height: 24px; }
details.fold > summary > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
details.fold > summary::after { content: "+"; margin-left: auto; color: var(--muted); font: 500 22px/1 var(--font-body); transition: transform 240ms var(--ease-out); }
details.fold[open] > summary::after { transform: rotate(45deg); }
details.fold[open] > summary { border-bottom: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; }
details.fold > :not(summary) { margin: var(--space-4) var(--space-6); }
details.fold > :not(summary):last-child { margin-bottom: var(--space-6); }
.subview { display: flex; flex-direction: column; gap: var(--space-6); }
h2.section-title { margin-top: var(--space-4); padding-top: var(--space-6); border-top: 1px solid var(--line); }
.fold-label { font: 600 12px/16px var(--font-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-top: var(--space-4); }
.panel.hero .big-line b { font-size: 48px; line-height: 1; letter-spacing: -0.02em; margin-right: 6px; }
.hero-foot { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

/* ── New components: score ring, factor bars, profile, sparkline, heat grid ── */
.home-hero { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: var(--space-6); align-items: stretch; }
.home-hero .intro { display: flex; flex-direction: column; gap: 14px; justify-content: center; padding: 8px 0; }

.score-card { display: grid; grid-template-columns: auto 1fr; gap: 20px; align-items: center; }
.ring { position: relative; width: var(--ring, 148px); aspect-ratio: 1; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .track { stroke: var(--soft); }
.ring .val { stroke: var(--primary); stroke-linecap: round; transition: stroke-dashoffset 1100ms var(--ease-out); }
.ring.good .val { stroke: var(--accent); }
:root:not([data-theme="dark"]) .ring.good .val { stroke: color-mix(in srgb, var(--accent) 62%, var(--ink)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .ring.good .val { stroke: var(--accent); } }
.ring .in { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .n { font: 700 calc(var(--ring, 148px) * 0.3)/1 var(--font-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.ring .of { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; }
.score-word { display: inline-block; align-self: flex-start; justify-self: start; padding: 2px 10px; border-radius: var(--radius-full); font: 600 12px/18px var(--font-body); letter-spacing: 0.04em; }
.score-word.good { background: var(--accent); color: var(--on-accent); }
.score-word.ok { background: var(--soft); color: var(--primary); }
.score-word.low { background: var(--note-soft); color: var(--danger); }
.profile-top { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: var(--space-6); }
.factor { display: grid; grid-template-columns: minmax(110px, 30%) 1fr 116px; gap: 12px; align-items: center; font-size: 14px; }

.factor .w.Strong { color: var(--success); } .factor .w.Good { color: var(--primary); } .factor .w.Weak, .factor .w.Missing { color: var(--danger); }
.factors { display: flex; flex-direction: column; gap: 10px; }
.spark { width: 100%; height: 120px; overflow: visible; }
.spark .area { fill: color-mix(in srgb, var(--primary) 14%, transparent); }
.spark .ln { fill: none; stroke: var(--primary); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.spark text { fill: var(--muted); font: 11px var(--font-body); }
.spark circle { fill: var(--surface-raised); stroke: var(--primary); stroke-width: 2; }
.tone { display: flex; height: 14px; border-radius: var(--radius-full); overflow: hidden; gap: 2px; }
.recent-scores { display: flex; gap: 6px; align-items: flex-end; height: 104px; }
.recent-scores i { flex: 1 1 0; max-width: 22px; border-radius: 4px 4px 2px 2px; background: var(--primary); transform-origin: bottom; }
.recent-scores i.good { background: var(--accent); }
/* Lime is a fill for dark grounds. On light ones, graphics need 3:1: use a deepened lime. */
:root:not([data-theme="dark"]) { --lime-graphic: color-mix(in srgb, var(--accent) 62%, var(--ink)); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --lime-graphic: var(--accent); } }
:root[data-theme="dark"] { --lime-graphic: var(--accent); }
.recent-scores i.good, .bar-fill.lime, .dots.good i.on { background: var(--lime-graphic, var(--accent)); }
.recent-scores i.low { background: color-mix(in srgb, var(--danger) 70%, transparent); }
.heat { display: grid; grid-template-columns: 38px repeat(24, minmax(6px, 1fr)); gap: 3px; font-size: 11px; }
.heat .cell { aspect-ratio: 1; border-radius: 3px; background: var(--primary); }
.heat .rl { color: var(--muted); align-self: center; }
.heat .cl { color: var(--muted); }
.kw { display: flex; flex-wrap: wrap; gap: 8px; }
.kw span { padding: 4px 12px; border-radius: var(--radius-full); border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.kw span b { font-weight: 600; margin-left: 6px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kw span.top { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.kw span.top b { color: color-mix(in srgb, var(--on-accent) 70%, transparent); }
.insight { display: flex; flex-direction: column; gap: 10px; }
.insight .why { color: var(--muted); }
.insight .meta-row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); }
.proj { display: grid; grid-template-columns: 1fr auto; gap: 6px 16px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: center; }
.proj:last-child { border-bottom: 0; }
.proj .nm { font-weight: 600; overflow-wrap: anywhere; }
.proj .sub { font-size: 13px; color: var(--muted); }
.proj .stats { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }

/* Plan before you send */
.plan { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: var(--space-6); align-items: start; }
.plan-fields { display: flex; flex-direction: column; gap: 14px; }
.plan-field { display: flex; flex-direction: column; gap: 6px; }
.plan-field label { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
.plan-field label .tick { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; color: transparent;
  transition: background-color var(--dur-hover) ease, border-color var(--dur-hover) ease, color var(--dur-hover) ease, transform var(--dur-hover) var(--ease-out); }
.plan-field.done label .tick { background: var(--accent); border-color: var(--accent); color: var(--on-accent); transform: scale(1.08); }

.plan-field textarea { min-height: 64px; font-size: 15px; }
.plan-side { position: sticky; top: 140px; display: flex; flex-direction: column; gap: 14px; }

/* The clarity quip: a fun line on My profile that follows your last few scores. */
.quip { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; align-items: start; text-align: left; width: 100%; padding: 14px 16px; border-radius: var(--radius-md);
  border: 1px solid var(--line); background: var(--lime-soft); color: var(--ink); cursor: pointer; font: inherit;
  transition: transform var(--dur-press) var(--ease-out), border-color var(--dur-hover) ease; }
.quip:active { transform: scale(0.98); }
.quip-mark { grid-row: span 2; font: 700 40px/0.8 var(--font-display); color: var(--primary); }
.quip-text { font: 600 18px/1.35 var(--font-display); letter-spacing: -0.01em; }
.quip-meta { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .quip-text.swap { animation: rise 280ms var(--ease-out) both; } }
@media (hover: hover) and (pointer: fine) { .quip:hover { border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); } }
.quip-head { align-items: flex-start; flex-wrap: nowrap; }
.quip-head h2 { flex: none; }
.quip-head .quip { width: auto; max-width: min(100%, 340px); margin-left: auto; padding: 10px 14px; gap: 0 8px; }
.quip-head .quip-mark { font-size: 30px; }
.quip-head .quip-text { font-size: 15px; line-height: 1.3; }
@media (max-width: 560px) { .quip-head { flex-wrap: wrap; } .quip-head .quip { max-width: 100%; margin-left: 0; } }
.tok-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tok-row .tile { padding: 12px 14px; }
.tok-row .tile .value { font-size: 26px; }
@media (max-width: 560px) { .tok-row { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .js .view.enter .tbar rect { animation: grow-y 700ms var(--ease-out) both; transform-box: fill-box; transform-origin: bottom; } }
/* Token roadmap pop-up */
dialog.roadmap { width: min(980px, calc(100vw - 32px)); max-height: calc(100dvh - 48px); overflow: auto; border: 1px solid var(--line); border-radius: var(--radius-md);
  background: var(--surface-raised); color: var(--ink); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
dialog.roadmap::backdrop { background: color-mix(in srgb, var(--surface) 55%, rgba(0,0,0,.45)); backdrop-filter: blur(4px); }
dialog.roadmap .panel-head { align-items: flex-start; }
dialog.roadmap > * { flex: none; }
svg.flow { width: 100%; min-width: 620px; overflow: visible; }
svg.flow text { font: 12px var(--font-body); fill: var(--muted); }
svg.flow text.strong { fill: var(--ink); font-weight: 500; }
svg.flow .rib { transition: fill-opacity var(--dur-hover) ease; }
ol.road { list-style: none; margin: 0; padding: 0 0 0 22px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 14px 24px; position: relative; }
ol.road li { position: relative; display: flex; flex-direction: column; gap: 2px; padding-left: 4px; }
ol.road li::before { content: ""; position: absolute; left: -22px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--primary); box-shadow: 0 0 0 4px var(--soft); }
ol.road li.goal::before { background: var(--accent); box-shadow: 0 0 0 4px var(--lime-soft); }
ol.road li b { font: 600 17px/1.3 var(--font-display); }
@media (hover: hover) and (pointer: fine) { svg.flow .rib:hover { fill-opacity: 0.55; } }
@media (prefers-reduced-motion: no-preference) {
  dialog.roadmap[open] { animation: pop 260ms var(--ease-out) both; }
  dialog.roadmap[open]::backdrop { animation: fade 260ms ease both; }
  dialog.roadmap svg.flow .rib { animation: wipe-rib 900ms var(--ease-in-out) both; }
  dialog.roadmap ol.road li { animation: rise 360ms var(--ease-out) both; }
}
@keyframes wipe-rib { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
/* Profile header: a social-style card with your prompt sign */
.phead { gap: var(--space-6); background: linear-gradient(var(--surface-raised), var(--surface-raised)) padding-box; position: relative; overflow: hidden; }
.phead::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 96px; background: color-mix(in srgb, var(--primary) 14%, transparent); pointer-events: none; }
.phead > * { position: relative; }
.phead-main { display: grid; grid-template-columns: auto 1fr auto; gap: 20px 24px; align-items: center; }
.avatar { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; background: var(--primary); color: var(--on-primary);
  font: 700 52px/1 var(--font-display); box-shadow: 0 0 0 6px var(--surface-raised), 0 0 0 8px color-mix(in srgb, var(--accent) 80%, transparent); }
.phead-id { display: flex; flex-direction: column; gap: 6px; }
.phead-id h1 { font-size: clamp(30px, 4vw, 44px); line-height: 1.05; }

.pstat span { font-size: 13px; color: var(--muted); text-align: center; }
.traits { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 12px; }
.traits > div { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border-radius: var(--radius-md); background: var(--surface); border: 1px solid var(--line); }
.traits b { font: 600 17px/1.3 var(--font-display); }
@media (max-width: 760px) { .phead-main { grid-template-columns: auto 1fr; } .phead-score { grid-column: 1 / -1; flex-direction: row; max-width: none; } .avatar { width: 84px; height: 84px; font-size: 40px; } .pstats { grid-template-columns: repeat(2, 1fr); } .pstat:nth-child(3) { border-left: 0; } .pstat:nth-child(n+3) { border-top: 1px solid var(--line); } }

@media (max-width: 560px) { .phead-main { grid-template-columns: 1fr; } .phead::before { height: 72px; } }
/* Feed of your prompts */
.feed { display: flex; flex-direction: column; gap: 12px; }

.post-score span { font-size: 11px; margin-left: 1px; }
.post-score.good { background: var(--accent); color: var(--on-accent); }
.post-score.low { background: var(--note-soft); color: var(--danger); }
.post-body { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.post-meta { font-size: 13px; }
.post-text { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }

/* Tone bubbles */
.bubbles { position: relative; height: 300px; }
.bubble { position: absolute; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px; cursor: default;
  transition: transform 260ms var(--ease-out), box-shadow 260ms var(--ease-out); outline-offset: 4px; }
.bubble b { font: 700 22px/1 var(--font-display); }
.bubble span { font-size: 13px; font-weight: 600; }
.bubble em { font-style: normal; font-size: 12px; line-height: 1.25; max-width: 90%; max-height: 0; opacity: 0; overflow: hidden; transition: opacity 200ms ease, max-height 260ms var(--ease-out); }

.tone-word { font-family: var(--font-display); }
@keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -8px; } }
@media (prefers-reduced-motion: no-preference) { .bubble { animation: bob 5.2s ease-in-out infinite; } .bubble:hover, .bubble:focus-visible { animation-play-state: paused; } }
@media (prefers-reduced-motion: reduce) { .bubble:hover, .bubble:focus-visible { transform: none; } }
/* Prompt gallery */

  border: 1px solid color-mix(in srgb, var(--primary) 35%, var(--line)); background: var(--soft); }

.gallery-icon { width: 44px; height: 44px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--primary); color: var(--on-primary); font-size: 22px; }

.gallery-text mark { background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--ink); border-bottom: 2px solid var(--c); border-radius: 4px; padding: 2px 3px; }
.gallery-text mark sup { font: 600 10px/1 var(--font-body); letter-spacing: 0.04em; text-transform: uppercase; color: var(--c); margin-left: 4px; }
:root[data-theme="dark"] .gallery-text mark sup { filter: brightness(1.6); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gallery-text mark sup { filter: brightness(1.6); } }
.gallery-key { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 8px 18px; }
.gallery-key > div { display: grid; grid-template-columns: 12px auto; gap: 2px 8px; align-items: center; }
.gallery-key i { width: 12px; height: 12px; border-radius: 3px; }
.gallery-key span { grid-column: 2; }
