<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pompy Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Volt structure (pills, hairlines, Space Grotesk + Inter) in Pompy's own palette:
   black ground, electric blue for actions, purple for highlights, green for what went well.
   Dark is the default; data-theme="light" gives a light variant. */
:root {
  --surface: #07080c; --surface-raised: #10121a; --line: #22263a;
  --ink: #f1f3fa; --ink-muted: #9aa1b8;
  --primary: #4d8dff; --on-primary: #05060a;
  --purple: #a874ff; --accent-fill: #2ee6a0; --on-accent: #05060a;
  --success: #2ee6a0; --danger: #ff5c86;
  --shadow-lift: 0 8px 24px -12px rgba(0, 0, 0, 0.7);
  --shadow-glow: 0 6px 24px -6px rgba(77, 141, 255, 0.6);
  --shadow-focus: 0 0 0 4px rgba(168, 116, 255, 0.3);
  --brand-gradient: linear-gradient(90deg, #4d8dff, #a874ff 55%, #2ee6a0);
  --space-2: 8px; --space-4: 16px; --space-6: 24px; --space-10: 40px;
  --radius-sm: 6px; --radius-md: 12px; --radius-full: 9999px;
  --font-display: "Space Grotesk", system-ui, sans-serif;
  --font-body: Inter, system-ui, -apple-system, sans-serif;
  --font-mono: var(--font-body);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --surface: #f6f7fb; --surface-raised: #ffffff; --line: #e2e4ee;
  --ink: #0b0c12; --ink-muted: #565d74; --primary: #2f6bff; --on-primary: #ffffff;
  --purple: #7c3aed; --accent-fill: #18c486; --success: #0b8f5e; --danger: #d6335e;
  --shadow-glow: 0 6px 20px -6px rgba(47, 107, 255, 0.45);
  --shadow-focus: 0 0 0 4px rgba(124, 58, 237, 0.2); color-scheme: light;
}
:root {
  --paper: var(--surface); --panel: var(--surface-raised); --muted: var(--ink-muted);
  --accent: var(--primary);
  --accent-soft: color-mix(in srgb, var(--primary) 12%, var(--surface-raised));
  --note: var(--danger); --note-soft: color-mix(in srgb, var(--danger) 10%, var(--surface-raised));
  --good: var(--success); --warn: var(--ink-muted); --bad: var(--danger);
  --radius: var(--radius-md);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--surface); color: var(--ink); font: 16px/24px var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h2 { font-size: 1.5rem; line-height: 30px; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; line-height: 20px; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
input:focus-visible, textarea:focus-visible, select:focus-visible { box-shadow: var(--shadow-focus); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
header.top { background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.top-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; padding: 18px 0 10px; }
.brand { font-size: 1.6rem; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
.brand span { background: var(--brand-gradient); -webkit-background-clip: text; background-clip: text; color: transparent; }
.readouts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.8rem; color: var(--muted); }
.readouts b { color: var(--ink); font-weight: 500; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--muted);
  text-decoration: none; white-space: nowrap; font-weight: 500; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-image: var(--brand-gradient) 1; }
nav.tabs a:hover { color: var(--ink); }

main { padding: var(--space-10) 0 60px; }
section.view { display: none; flex-direction: column; gap: var(--space-10); }
section.view.on { display: flex; }
.lede { max-width: 68ch; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: var(--space-6); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4) var(--space-6); }
.tile .label { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
.tile .value { font-family: var(--font-display); font-variant-numeric: tabular-nums; font-size: 2rem; font-weight: 600; line-height: 1.2; margin-top: 4px; letter-spacing: -0.01em; }
.tile .sub { font-size: 0.8rem; color: var(--muted); }

.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr 56px; gap: 10px; align-items: center; font-size: 0.86rem; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 10px; background: var(--accent-soft); border-radius: var(--radius-full); overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--purple)); border-radius: var(--radius-full); }
.bar-row .num { text-align: right; font-size: 0.8rem; color: var(--muted); }

.heat { display: grid; grid-template-columns: 34px repeat(24, minmax(8px, 1fr)); gap: 2px; font-size: 0.7rem; }
.heat .cell { aspect-ratio: 1; border-radius: 2px; background: var(--accent-soft); }
.heat .rl { color: var(--muted); align-self: center; }
.heat .cl { color: var(--muted); text-align: left; grid-row: 9; }
.readout { min-height: 1.4em; font-size: 0.84rem; color: var(--muted); font-family: var(--font-mono); }
.chart { width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.chart text.faint { opacity: 0.45; }
.chart text.strong { fill: var(--ink); font-weight: 500; }
.chart circle:hover, .chart circle:focus { fill-opacity: 1; stroke: var(--ink); stroke-width: 1.5; outline: none; }
.chart g.month:hover rect, .chart g.month:focus rect { opacity: 0.85; }
.chart g.month:focus { outline: none; }
.legend { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.legend .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.legend .dot.sq { border-radius: 3px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 0.78rem; white-space: nowrap; }
.chip.task { border-color: var(--accent); color: var(--accent); }
.chip.fr { background: var(--note-soft); border-color: transparent; color: var(--note); }
.chip.ok { color: var(--good); border-color: var(--good); }
.pill { font-size: 12px; line-height: 16px; font-weight: 600; padding: 3px 10px; border-radius: var(--radius-full);
  background: var(--accent-fill); color: var(--on-accent); min-width: 44px; text-align: center; font-variant-numeric: tabular-nums; }
.pill.low { background: var(--note-soft); color: var(--danger); }
.pill.none { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.note { background: color-mix(in srgb, var(--purple) 12%, var(--surface-raised)); border: 1px solid color-mix(in srgb, var(--purple) 55%, transparent); padding: var(--space-2) var(--space-4); border-radius: var(--radius-sm); font-size: 0.875rem; }
.thin { color: var(--warn); font-size: 0.78rem; }

.btn { border: 1px solid var(--line); background: var(--panel); padding: 8px 18px; border-radius: var(--radius-full); cursor: pointer; font-weight: 500;
  transition: border-color 0.15s ease-out, box-shadow 0.2s ease-out, transform 0.15s ease-out; }
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.btn.primary:hover { box-shadow: var(--shadow-glow); }
.btn.primary:active { box-shadow: none; transform: translateY(1px); }
.btn:disabled { opacity: 0.5; cursor: default; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls select, .controls input, input.text, textarea, select.sel {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 8px 12px; min-width: 0; }
.controls input[type="search"] { flex: 1 1 220px; }
textarea { width: 100%; resize: vertical; min-height: 110px; line-height: 1.5; }

.plist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.prow:hover { background: var(--accent-soft); }
.prow .meta { font-size: 0.76rem; color: var(--muted); font-family: var(--font-mono); }
.prow .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.prow .right { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; align-content: start; max-width: 240px; }
.detail { grid-column: 1 / -1; cursor: default; display: flex; flex-direction: column; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: var(--space-4); margin-top: 4px; }
.detail .full { white-space: pre-wrap; overflow-wrap: anywhere; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 12px; font-size: 0.86rem; }
.checks .yes::before { content: "✓ "; color: var(--good); }
.checks .no { color: var(--muted); }
.checks .no::before { content: "· "; }
.seg { display: flex; gap: 3px; }
.seg i { width: 26px; height: 10px; border-radius: var(--radius-full); background: var(--accent-soft); }
.seg i.on { background: var(--accent); }
.big { font-family: var(--font-display); font-weight: 700; font-size: 2.6rem; line-height: 1; }
.quote { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.quote.after { border-left-color: var(--good); }
.habit-rank { font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--purple); font-size: 12px; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
table.cmp th, table.cmp td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
table.cmp td.indent { padding-left: 22px; color: var(--muted); }
.better { color: var(--good); } .worse { color: var(--bad); }
.scroll-x { overflow-x: auto; }
.meter { height: 8px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; }
.meter > div { height: 100%; background: var(--accent); }
.ws-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 0.88rem; }
.ws-item .rank { font-family: var(--font-mono); color: var(--muted); }
.ws-item > .chip { align-self: start; }
.ws-item.out { opacity: 0.6; }
.layers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.layer { border: 1px solid var(--line); border-radius: var(--radius); padding: var(--space-4); background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.layer .tag { font-size: 12px; line-height: 16px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--purple); }
.hidden { display: none !important; }
.layer-fact { font-family: var(--font-display); font-size: 1.6rem; font-weight: 600; }
.prow.static { cursor: default; }
.controls.spread { justify-content: space-between; }
.seg-tabs { display: inline-flex; gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: var(--radius-full); }
.seg-tab { border: 0; background: transparent; padding: 6px 14px; border-radius: var(--radius-full); color: var(--muted); cursor: pointer; font-weight: 500; }
.seg-tab[aria-selected="true"] { background: var(--primary); color: var(--on-primary); }
.linkish { border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 0.875rem; }
.coach { max-width: 760px; }
.coach textarea { min-height: 140px; font-size: 1.05rem; }
.dots { display: flex; gap: 6px; }
.dots i { width: 14px; height: 14px; border-radius: 50%; background: var(--line); }
.dots.good i.on { background: var(--success); } .dots.ok i.on { background: var(--primary); } .dots.low i.on { background: var(--purple); }
.coach-score { font-family: var(--font-display); font-size: 1.2rem; }
.coach-score.good { color: var(--success); } .coach-score.ok { color: var(--primary); } .coach-score.low { color: var(--purple); }
ul.next-list { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.coach-read { display: flex; flex-direction: column; gap: 10px; min-height: 3em; }
.better-block { display: flex; flex-direction: column; gap: 10px; }
.habit-body { display: flex; flex-direction: column; gap: 12px; border-top: 1px solid var(--line); padding-top: var(--space-4); }
ul.analysis { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; font-size: 0.92rem; }
ul.analysis li { padding-left: 1.4em; position: relative; }
ul.analysis li::before { content: "✕"; position: absolute; left: 0; color: var(--danger); font-weight: 700; }
ul.analysis li.focus { background: color-mix(in srgb, var(--purple) 14%, transparent); border-radius: var(--radius-sm); padding: 4px 8px 4px 1.8em; }
ul.analysis li.focus::before { left: 8px; top: 4px; color: var(--purple); }
ol.parts { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; font-size: 0.875rem; }
ol.parts li::marker { color: var(--purple); font-weight: 600; }
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .panel { padding: var(--space-4); }
  .prow { grid-template-columns: 1fr; }
  .prow .right { justify-content: flex-start; max-width: none; }
  .big { font-size: 2rem; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1 class="brand">Pompy <span>Dashboard</span></h1>
      <div class="readouts" id="readouts"><span>Loading your memory…</span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#overview">Overview</a>
      <a href="#habits">Habits</a>
      <a href="#prompts">Prompts</a>
      <a href="#ask">Ask Pompy</a>
      <a href="#memory">Memory Lab</a>
      <a href="#compare">Compare</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <p id="load-error" class="note hidden"></p>
  <section class="view" id="view-overview"></section>
  <section class="view" id="view-habits"></section>
  <section class="view" id="view-prompts"></section>
  <section class="view" id="view-ask"></section>
  <section class="view" id="view-memory"></section>
  <section class="view" id="view-compare"></section>
</main>
<script src="scorer.js"></script>
<script src="app-core.js"></script>
<script src="app-tabs.js"></script>
<script src="app-lab.js"></script>
<script>window.Pompy.start();</script>
</body>
</html>
