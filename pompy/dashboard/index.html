<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pompy Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a lab notebook. Instrument readouts up top, one tab per experiment,
   panels in a single column that splits in two on wide screens; every number in mono. */
:root {
  --paper: #f4f6f9;
  --panel: #ffffff;
  --ink: #141a24;
  --muted: #5d6776;
  --line: #dde2ea;
  --accent: #2a5bd7;
  --accent-soft: #e6edfc;
  --note: #b26b00;
  --note-soft: #fdf3e2;
  --good: #1d8a58;
  --warn: #b7791f;
  --bad: #c2413b;
  --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Helvetica Neue", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --radius: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1219; --panel: #161c26; --ink: #e6ebf2; --muted: #98a3b4; --line: #2a3344;
    --accent: #84a6ff; --accent-soft: #1c2945; --note: #e6a547; --note-soft: #2d2413;
    --good: #4cc38a; --warn: #e0b04a; --bad: #f07a70; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1219; --panel: #161c26; --ink: #e6ebf2; --muted: #98a3b4; --line: #2a3344;
  --accent: #84a6ff; --accent-soft: #1c2945; --note: #e6a547; --note-soft: #2d2413;
  --good: #4cc38a; --warn: #e0b04a; --bad: #f07a70; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--font-body); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
h2 { font-size: 1.15rem; font-weight: 700; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.wrap { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
header.top { background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
.top-row { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 20px; padding: 18px 0 10px; }
.brand { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.01em; }
.brand span { color: var(--accent); }
.readouts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.8rem; color: var(--muted); }
.readouts b { color: var(--ink); font-weight: 500; }
nav.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { padding: 10px 14px; border-bottom: 2px solid transparent; color: var(--muted);
  text-decoration: none; white-space: nowrap; font-weight: 500; }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
nav.tabs a:hover { color: var(--ink); }

main { padding: 22px 0 60px; }
section.view { display: none; flex-direction: column; gap: 18px; }
section.view.on { display: flex; }
.lede { max-width: 68ch; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); gap: 18px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
.tile .label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
.tile .value { font-family: var(--font-mono); font-size: 1.7rem; font-weight: 500; line-height: 1.2; margin-top: 4px; }
.tile .sub { font-size: 0.8rem; color: var(--muted); }

.bars { display: flex; flex-direction: column; gap: 6px; }
.bar-row { display: grid; grid-template-columns: minmax(90px, 34%) 1fr 56px; gap: 10px; align-items: center; font-size: 0.86rem; }
.bar-row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 10px; background: var(--accent-soft); border-radius: 5px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 5px; }
.bar-row .num { text-align: right; font-size: 0.8rem; color: var(--muted); }

.heat { display: grid; grid-template-columns: 34px repeat(24, minmax(8px, 1fr)); gap: 2px; font-size: 0.7rem; }
.heat .cell { aspect-ratio: 1; border-radius: 2px; background: var(--accent-soft); }
.heat .rl { color: var(--muted); align-self: center; }
.heat .cl { color: var(--muted); text-align: left; grid-row: 9; }
.readout { min-height: 1.4em; font-size: 0.84rem; color: var(--muted); font-family: var(--font-mono); }
.chart { width: 100%; overflow: visible; }
.chart text { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--line); font-size: 0.78rem; white-space: nowrap; }
.chip.task { border-color: var(--accent); color: var(--accent); }
.chip.fr { background: var(--note-soft); border-color: transparent; color: var(--note); }
.chip.ok { color: var(--good); border-color: var(--good); }
.pill { font-family: var(--font-mono); font-size: 0.8rem; padding: 1px 8px; border-radius: 6px;
  background: var(--accent-soft); color: var(--accent); min-width: 42px; text-align: center; }
.pill.low { background: var(--note-soft); color: var(--note); }
.pill.none { background: transparent; color: var(--muted); border: 1px dashed var(--line); }
.note { background: var(--note-soft); border-left: 3px solid var(--note); padding: 10px 12px; border-radius: 6px; font-size: 0.88rem; }
.thin { color: var(--warn); font-size: 0.78rem; }

.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 13px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: 0.5; cursor: default; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.controls select, .controls input, input.text, textarea, select.sel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.controls input[type="search"] { flex: 1 1 220px; }
textarea { width: 100%; resize: vertical; min-height: 110px; line-height: 1.5; }

.plist { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.prow { display: grid; grid-template-columns: 1fr auto; gap: 6px 14px; padding: 11px 4px; border-bottom: 1px solid var(--line); cursor: pointer; }
.prow:hover { background: var(--paper); }
.prow .meta { font-size: 0.76rem; color: var(--muted); font-family: var(--font-mono); }
.prow .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; }
.prow .right { display: flex; flex-wrap: wrap; gap: 5px; justify-content: flex-end; align-content: start; max-width: 240px; }
.detail { grid-column: 1 / -1; cursor: default; display: flex; flex-direction: column; gap: 10px;
  background: var(--paper); border-radius: 8px; padding: 12px; margin-top: 4px; }
.detail .full { white-space: pre-wrap; overflow-wrap: anywhere; }
.checks { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 4px 12px; font-size: 0.86rem; }
.checks .yes::before { content: "✓ "; color: var(--good); }
.checks .no { color: var(--muted); }
.checks .no::before { content: "· "; }
.seg { display: flex; gap: 3px; }
.seg i { width: 26px; height: 10px; border-radius: 3px; background: var(--accent-soft); }
.seg i.on { background: var(--accent); }
.big { font-family: var(--font-mono); font-size: 2.6rem; line-height: 1; }
.quote { border-left: 3px solid var(--line); padding: 4px 0 4px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.quote.after { border-left-color: var(--good); }
.habit-rank { font-family: var(--font-mono); color: var(--accent); font-size: 0.85rem; }
table.cmp { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
table.cmp th, table.cmp td { padding: 7px 8px; border-bottom: 1px solid var(--line); text-align: right; }
table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
table.cmp td.indent { padding-left: 22px; color: var(--muted); }
.better { color: var(--good); } .worse { color: var(--bad); }
.scroll-x { overflow-x: auto; }
.meter { height: 8px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; }
.meter > div { height: 100%; background: var(--accent); }
.ws-item { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); font-size: 0.88rem; }
.ws-item .rank { font-family: var(--font-mono); color: var(--muted); }
.ws-item > .chip { align-self: start; }
.ws-item.out { opacity: 0.6; }
.layers { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap: 12px; }
.layer { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; background: var(--panel); display: flex; flex-direction: column; gap: 6px; }
.layer .tag { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); }
.hidden { display: none !important; }
@media (max-width: 560px) {
  .wrap { padding: 0 16px; }
  .prow { grid-template-columns: 1fr; }
  .prow .right { justify-content: flex-start; max-width: none; }
  .big { font-size: 2rem; }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="top-row">
      <h1 class="brand">Pompy <span>Dashboard</span></h1>
      <div class="readouts" id="readouts"><span>Loading your memory…</span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections">
      <a href="#overview">Overview</a>
      <a href="#habits">Habits</a>
      <a href="#prompts">Prompts</a>
      <a href="#ask">Ask Pompy</a>
      <a href="#memory">Memory Lab</a>
      <a href="#compare">Compare</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <p id="load-error" class="note hidden"></p>
  <section class="view" id="view-overview"></section>
  <section class="view" id="view-habits"></section>
  <section class="view" id="view-prompts"></section>
  <section class="view" id="view-ask"></section>
  <section class="view" id="view-memory"></section>
  <section class="view" id="view-compare"></section>
</main>
<script src="scorer.js"></script>
<script src="app-core.js"></script>
<script src="app-tabs.js"></script>
<script src="app-lab.js"></script>
<script>window.Pompy.start();</script>
</body>
</html>
