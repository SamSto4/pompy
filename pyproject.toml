[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pompy"
version = "0.0.1"
description = "Personal pattern recognizer for how you prompt Claude, built on layered agentic memory + RAG."
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "numpy>=2"]  # numpy: the test doubles for meaning search
# Phase 2: local embeddings (meaning search). Optional: without it Pompy runs keyword-only.
memory = ["fastembed>=0.9", "numpy>=2"]
# Phase 3: the hypothesis agent (`pompy think`). Needs ANTHROPIC_API_KEY in a git-ignored .env.
agent = ["anthropic>=1"]

[project.scripts]
pompy = "pompy.cli:main"

[tool.setuptools.packages.find]
include = ["pompy*"]

[tool.setuptools.package-data]
pompy = ["dashboard/*.html", "dashboard/*.js"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
